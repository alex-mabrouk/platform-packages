apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-schema
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PGHOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ required "database.name is required" .Values.database.name | quote }}
            - name: PGSSLMODE
              value: {{ .Values.database.sslMode | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secret.name is required" .Values.database.secret.name | quote }}
                  key: {{ .Values.database.secret.usernameKey | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name | quote }}
                  key: {{ .Values.database.secret.passwordKey | quote }}
            - name: SCHEMA
              value: {{ required "schema is required" .Values.schema | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            # psql quotes the name; it only interpolates variables read from stdin.
            - echo 'CREATE SCHEMA IF NOT EXISTS :"schema";' | psql -v ON_ERROR_STOP=1 -v schema="$SCHEMA"
