apiVersion: v1alpha1
name: polaris
tag: 2.0.0-alpha.4 # x-release-please-version
description: |
  Apache Polaris is an open-source, fully-featured catalog for Apache Iceberg™.
usage:
  text: |
    Apache Polaris is an open-source, fully-featured catalog for Apache Iceberg™.
    Access the UI at https://polaris-console-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
    Realm {{ .Parameters.realm }}, root credentials in Secret creds-{{ .Release.metadata.name }}-root (keys client_id and client_secret)
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 1.8.0
    displayName: Apache Polaris
    description: Iceberg REST catalog of a project, with its console
    category: catalog
    maturity: beta
    edition: community
    license: Apache-2.0
    documentation: https://polaris.apache.org/releases/1.8.0/
    maintainer: OKDP
    keywords: [polaris, iceberg, catalog]
    capabilities:
      - name: okdp.io/iceberg-catalog
      - name: okdp.io/data-catalog
    dependencies:
      - capability: okdp.io/ingress
        providerScope: system-wide
      - capability: okdp.io/certificate-manager
        providerScope: system-wide
      - capability: okdp.io/identity-provider
        providerScope: system-wide
      - capability: okdp.io/platform-tools
        providerScope: system-wide
      - capability: okdp.io/secrets-backend
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [db, storage, s3SecretRef]
      properties:
        db:
          type: string
          minLength: 1
          title: Metadata database
          description: "Name of the database-server Connection, a PostgreSQL server hosting the Polaris metastore database."
          x-okdp-group: Catalog
          x-okdp-order: 1
          x-okdp-connection: db
        realm:
          type: string
          minLength: 1
          default: "default"
          title: Realm
          description: "Polaris realm served by this instance. Clients select it with the Polaris-Realm header, and the catalog Connection publishes it."
          x-okdp-group: Catalog
          x-okdp-order: 3
        principals:
          type: array
          title: Principals
          description: "Polaris principals to create in the realm, with their principal roles, one entry per principal, for example [{\"name\": \"alice\", \"roles\": [\"catalog_admin\"]}]. Humans and service accounts authenticate through the platform identity provider and get the roles granted here."
          x-okdp-group: Catalog
          x-okdp-order: 4
          x-okdp-advanced: true
          x-okdp-widget: yaml
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1 }
              roles:
                type: array
                items: { type: string }
        storage:
          type: string
          minLength: 1
          title: Object store
          description: "Name of the s3 Connection backing the catalogs."
          x-okdp-group: Storage
          x-okdp-order: 1
          x-okdp-connection: storage
        s3SecretRef:
          type: string
          minLength: 1
          title: S3 credentials secret
          description: "Secret with keys accessKey/secretKey, this consumer's own S3 identity (STS and catalog-side Iceberg metadata operations)."
          x-okdp-group: Storage
          x-okdp-order: 2
          x-okdp-secret-ref: true
        memoryGi:
          type: number
          default: 1
          multipleOf: 0.25
          title: Memory (GiB)
          x-okdp-group: Sizing
          x-okdp-order: 1
          x-okdp-advanced: true
    connections:
      consumes:
        - name: db
          contract: database-server
          version: "1"
          description: PostgreSQL server hosting the Polaris metastore database
        - name: storage
          contract: s3
          version: "1"
          description: Object store backing the catalogs
      publishes:
        - name: catalog
          contract: iceberg-catalog
          version: "1"
          description: Iceberg REST endpoint and realm of the instance
    endpoints:
      - name: api
        kind: api
        protocol: http
        authentication: oidc
        description: Iceberg REST and management API
      - name: console
        kind: ui
        protocol: http
        authentication: oidc
        description: Polaris console
    sideEffects:
      external:
        - kind: identity-client
          description: OIDC clients of the server and the console, registered through dynamic client registration when the platform provisions clients that way
    lifecycle:
      applyTimeout: 15m
      rollback: unsupported
      irreversible: "The bootstrap writes the realm and its root credentials into the database, which keeps them when the instance goes away."
    health:
      http: { endpoint: console, path: /health }

schema:
  parameters: *parameters
  context:
    properties:
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          scope: { type: string, default: "openid profile email groups" }
          clientProvisioning: { type: string, default: dcr }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }

inputs:
  - { contract: database-server, alias: db, fromParameter: db }
  - { contract: s3, alias: storage, fromParameter: storage }

modules:
  # Registers the OIDC clients through anonymous Dynamic Client Registration.
  # Active only when the platform provisions clients that way; the credentials
  # land in Secrets carrying the same keys the deployments read.
  - name: oidc-dcr
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "dcr") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        # Required by the chart, unused by client_credentials.
        redirect_uris:
          - "https://polaris-{{ $namespace }}.{{ .Context.ingress.suffix }}/"
        grant_types:
          - "client_credentials"
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"
          client_secret: ".client_secret"

  # The public client of the console. After oidc-dcr: both write their hook
  # objects under the same names.
  - name: oidc-dcr-console
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}'
    dependsOn:
      - oidc-dcr
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "dcr") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}-console"
        token_endpoint_auth_method: "none"
        redirect_uris:
          - "https://polaris-console-{{ $namespace }}.{{ .Context.ingress.suffix }}/auth/callback"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        # openid is rejected by Keycloak here.
        scope: {{ append (without (splitList " " (.Context.oidc.scope | default "openid profile email groups")) "openid") "offline_access" | join " " | quote }}
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr-console"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"

  # Root credentials of the realm. Kept when the Release goes away, the
  # bootstrapped realm lives on in the database with these credentials.
  - name: internal-secrets
    source:
      local:
        path: ../../../charts/internal-secrets
    values: |
      secrets:
        - name: "creds-{{ .Release.metadata.name }}-root"
          keep: true
          data:
            client_id: root
          fields:
            - fieldName: client_secret
              encoding: base64
              length: "32"
        - name: "creds-{{ .Release.metadata.name }}-token-key"
          fields:
            - fieldName: symmetric.key
              length: "64"

  # Polaris no longer creates its database schema; the bootstrap expects it.
  - name: schema
    timeout: 5m
    source:
      local:
        path: ../../../charts/postgres-schema
    values: |
      schema: polaris_schema
      database:
        host: {{ .Inputs.db.host | quote }}
        port: {{ .Inputs.db.port }}
        name: {{ .Inputs.db.dbName | quote }}
        sslMode: {{ .Inputs.db.sslMode | default "prefer" | quote }}
        secret:
          name: {{ .Inputs.db.secretRef | quote }}

  - name: bootstrap
    dependsOn:
      - internal-secrets
      - schema
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/polaris-admin
        tag: 1.0.0
    values: |
      phase: "bootstrap"

      bootstrap:

        purge: false

        image:
          repository: apache/polaris-admin-tool
          tag: 1.8.0
          pullPolicy: IfNotPresent

        database:
          jdbcUrl: "jdbc:postgresql://{{ .Inputs.db.host }}:{{ .Inputs.db.port }}/{{ .Inputs.db.dbName }}"
          secret:
            name: {{ .Inputs.db.secretRef }}
            usernameKey: username
            passwordKey: password

      realms:
        - name: {{ .Parameters.realm | quote }}
          rootPrincipal:
            name: root
            credentialsSecret:
              name: {{ printf "creds-%s-root" .Release.metadata.name | quote }}
              clientIdKey: client_id
              clientSecretKey: client_secret
          principals:
            {{- toYaml (.Parameters.principals | default list) | nindent 12 }}

  - name: main
    dependsOn:
      - bootstrap
    timeout: 10m
    source:
      helmRepository:
        url: https://downloads.apache.org/polaris/helm-chart/
        chart: polaris
        version: 1.8.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $databaseJdbcUrl := printf "jdbc:postgresql://%v:%v/%v" .Inputs.db.host .Inputs.db.port .Inputs.db.dbName -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $oauthSecret := printf "creds-%s-oauth2" .Release.metadata.name -}}
      {{- if eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}{{- $oauthSecret = printf "%s-%s-dcr" .Release.metadata.name $namespace -}}{{- end }}

      {{- $polarisEndpointAPIUrl := printf "https://polaris-%s.%s" $namespace $domain -}}
      {{- $polarisEndpointAPIHost := regexReplaceAll "^https?://" $polarisEndpointAPIUrl "" -}}

      {{- $storageApiUrl := .Inputs.storage.apiUrl -}}
      {{- $storageRegion := .Inputs.storage.region -}}

      image:
        repository: apache/polaris
        pullPolicy: IfNotPresent
        tag: "1.8.0"

      resources:
        limits:
          memory: "{{ .Parameters.memoryGi }}Gi"
        requests:
          memory: "512Mi"

      extraEnv:
        # S3
        - name: AWS_REGION
          value: {{ $storageRegion }}
        - name: AWS_ENDPOINT_URL_S3
          value: {{ $storageApiUrl }}
        - name: AWS_ENDPOINT_URL_STS
          value: {{ $storageApiUrl }}
        # The Polaris S3 identity for STS
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: secretKey
        # Polaris Database
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: {{ $databaseJdbcUrl }}
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Inputs.db.secretRef }}
              key: username
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Inputs.db.secretRef }}
              key: password
        - name: QUARKUS_OIDC_TLS_CONFIGURATION_NAME
          value: "oidc"
        - name: QUARKUS_TLS__OIDC__TRUST_STORE_PEM_CERTS
          value: "/cacerts/ca.crt"
        # OIDC, Enable multi-tenancy (Multiple realms)
        - name: QUARKUS_OIDC_TENANT-ENABLED
          value: "true"
        - name: QUARKUS_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $oauthSecret }}
              key: client_id
        # Trust The CA
        - name: JAVA_TOOL_OPTIONS
          value: >-
            -Djavax.net.ssl.trustStore=/cacerts/bundle.p12
            -Djavax.net.ssl.trustStoreType=PKCS12
            -Djavax.net.ssl.trustStorePassword=

      persistence:
        type: relational-jdbc

      features:
        DROP_WITH_PURGE_ENABLED: true
        # ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING: false
        SUPPORTED_CATALOG_STORAGE_TYPES:
          - S3
        realmOverrides: {}
        # my-realm:
        #   ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING: true

      realmContext:
        type: default
        realms:
          - {{ .Parameters.realm | quote }}

      advancedConfig:
        polaris.realm-context.header-name: "Polaris-Realm"
        # Spark and Trino do not pass the header
        # polaris.realm-context.require-header: false

      authentication:
        type: mixed
        tokenBroker:
          type: symmetric-key
          secret:
            name: "creds-{{ .Release.metadata.name }}-token-key"

      oidc:
        authServeUrl: {{ $oidcIssuerUri }}
        client:
          id: ~
          secret:
            name: {{ $oauthSecret }}
            key: client_secret

        # Map polaris internal principal and roles with OIDC principal and groups
        principalMapper:
          type: default
          # You can use 'sub' as stable and immutable identity
          idClaimPath: ~
          nameClaimPath: "preferred_username"
        # Polaris refuses a token asking for a principal role not granted to the principal, so only the
        # polaris_<role> groups are passed on, as PRINCIPAL_ROLE:<role>. The roles must be granted in Polaris.
        principalRolesMapper:
          type: default
          rolesClaimPath: groups
          filter: "^polaris_.+$"
          mappings:
            - regex: "^polaris_(.*)$"
              replacement: "PRINCIPAL_ROLE:$1"

      cors:
        enabled: true
        allowedOrigins:
          - "https://polaris-console-{{ $namespace }}.{{ $domain }}"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "PATCH"
          - "OPTIONS"
        allowedHeaders:
          - "Content-Type"
          - "Authorization"
          - "Polaris-Realm"
          - "X-Request-ID"
        exposedHeaders:
          - "*"
        accessControlMaxAge: "PT10M"
        accessControlAllowCredentials: true

      ingress:
        enabled: true
        className: {{ .Context.ingress.className }}
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $polarisEndpointAPIHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $polarisEndpointAPIHost }}
            secretName: {{ .Release.metadata.name }}-tls

      extraVolumes:
        - name: cacerts
          secret:
            secretName: certs-bundle

      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts

  - name: principals
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/polaris-admin
        tag: 1.0.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}

      {{- $polarisInternalUrl := printf "http://%s-main.%s.svc.cluster.local:8181" .Release.metadata.name $namespace -}}

      phase: "principals"

      principals:

        image:
          repository: curlimages/curl
          tag: 8.23.0
          pullPolicy: IfNotPresent

        polaris:
          url: {{ $polarisInternalUrl }}

        # The chart defaults this to a bundle path, and curl refuses a --cacert
        # that does not exist. The in-cluster call is plain HTTP.
        caCertPath: ""

      realms:
        - name: {{ .Parameters.realm | quote }}
          rootPrincipal:
            name: root
            credentialsSecret:
              name: {{ printf "creds-%s-root" .Release.metadata.name | quote }}
              clientIdKey: client_id
              clientSecretKey: client_secret
          principals:
            {{- toYaml (.Parameters.principals | default list) | nindent 12 }}

  - name: console
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: ghcr.io/alex-mabrouk/charts/polaris-console
        tag: 0.2.1
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}

      {{- $polarisEndpointAPIUrl := printf "https://polaris-%s.%s" $namespace $domain -}}

      {{- $polarisEndpointConsoleUrl := printf "https://polaris-console-%s.%s" $namespace $domain -}}
      {{- $polarisEndpointConsoleHost := regexReplaceAll "^https?://" $polarisEndpointConsoleUrl "" -}}
      {{- $dcrConsole := eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" -}}

      image:
        repository: quay.io/okdp/polaris-console
        tag: v0.1.1
        pullPolicy: Always

      env:
        polarisApiUrl: "{{ $polarisEndpointAPIUrl }}"
        polarisRealm: "{{ .Parameters.realm }}"
        oauthTokenUrl: "{{ $polarisEndpointAPIUrl }}/api/catalog/v1/oauth/tokens"

      extraEnv:
        VITE_OIDC_ISSUER_URL: "{{ $oidcIssuerUri }}"
        {{- if not $dcrConsole }}
        VITE_OIDC_CLIENT_ID: "polaris-console"
        {{- end }}
        VITE_OIDC_REDIRECT_URI: "{{ $polarisEndpointConsoleUrl }}/auth/callback"
        VITE_OIDC_SCOPE: "{{ .Context.oidc.scope | default "openid profile email groups" }} offline_access"

      {{- if $dcrConsole }}
      extraEnvVars:
        - name: VITE_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.metadata.name }}-{{ $namespace }}-dcr-console"
              key: client_id
      {{- end }}

      ingress:
        enabled: true
        className: {{ .Context.ingress.className }}
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $polarisEndpointConsoleHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: polaris-console-tls
            hosts:
              - {{ $polarisEndpointConsoleHost }}

outputs:
  - name: catalog
    contract: iceberg-catalog
    values:
      uri: "https://polaris-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}/api/catalog"
      internalUri: "http://{{ .Release.metadata.name }}-main.{{ .Release.spec.targetNamespace }}.svc.cluster.local:8181/api/catalog"
      realm: "{{ .Parameters.realm }}"
roles:
  - okdp.io/iceberg-catalog
  - okdp.io/data-catalog
dependencies:
  - okdp.io/ingress
  - okdp.io/certificate-manager
  - okdp.io/identity-provider
  - okdp.io/platform-tools
  - okdp.io/secrets-backend
