apiVersion: v1alpha1
name: spark-defaults
tag: 2.0.0-alpha.2 # x-release-please-version
description: |
  Helm chart that provisions the spark default properties.
usage:
  text: |
    Helm chart that provisions the spark default properties.
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 1.0.0
    displayName: Spark defaults
    description: Default Spark properties read by the Spark jobs of a project
    category: processing
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://spark.apache.org/docs/latest/configuration.html
    maintainer: OKDP
    keywords: [spark, configuration]
    capabilities:
      - name: okdp.io/spark-defaults
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties: {}
    lifecycle:
      applyTimeout: 10m
      rollback: supported

schema:
  parameters: *parameters

modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-defaults
        tag: 1.0.1
    values: |
roles:
  - okdp.io/spark-defaults
