apiVersion: v1alpha1
name: hive-metastore
tag: 2.0.0 # x-release-please-version
description: |
  Hive Metastore is a centralized metadata repository for data lakes and big data analytics.
  Stores and manages table schemas, partition information, and data locations for engines like Apache Hive, Spark, and Trino.
  Enables consistent schema access across distributed storage systems such as HDFS and Amazon S3,
  providing the foundation for unified SQL-based querying over large-scale datasets.
usage:
  text: |
    Hive Metastore is a centralized metadata repository for data lakes and big data analytics.
    Engines reach it at thrift://{{ .Release.metadata.name }}.{{ .Release.spec.targetNamespace }}.svc.cluster.local:9083
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 4.0.1
    displayName: Hive Metastore
    description: Table metadata of a project's data lake, served over thrift to the query engines
    category: catalog
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://hive.apache.org/
    maintainer: OKDP
    keywords: [hive, metastore, catalog]
    capabilities:
      - name: okdp.io/hive-metastore
      - name: okdp.io/data-catalog
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [db, storage, s3SecretRef]
      properties:
        cpu:
          type: number
          default: 0.5
          multipleOf: 0.25
          title: CPU (vCPU)
          description: "CPU request in vCPU. The limit is twice the request."
          x-okdp-group: Resources
          x-okdp-order: 1
        memoryGi:
          type: number
          default: 0.5
          multipleOf: 0.25
          title: Memory (GiB)
          description: "Memory request. The limit is twice the request."
          x-okdp-group: Resources
          x-okdp-order: 2
        db:
          type: string
          minLength: 1
          title: Metadata database
          description: "Name of the database-server Connection hosting the metastore schema."
          x-okdp-group: Cluster
          x-okdp-order: 1
          x-okdp-connection: db
        storage:
          type: string
          minLength: 1
          title: Object store
          description: "Name of the s3 Connection hosting the warehouse."
          x-okdp-group: Storage
          x-okdp-order: 1
          x-okdp-connection: storage
        s3SecretRef:
          type: string
          minLength: 1
          title: S3 credentials secret
          description: "Secret with keys accessKey/secretKey, this consumer's own S3 identity."
          x-okdp-group: Storage
          x-okdp-order: 2
          x-okdp-secret-ref: true
        warehouseBucket:
          type: string
          minLength: 1
          default: hive
          title: Warehouse bucket
          description: "S3 bucket used as the warehouse directory."
          x-okdp-group: Storage
          x-okdp-order: 3
    connections:
      consumes:
        - name: db
          contract: database-server
          version: "1"
          description: Database hosting the metastore schema
        - name: storage
          contract: s3
          version: "1"
          description: Object store hosting the warehouse
      publishes:
        - name: metastore
          contract: hive
          version: "1"
          description: Thrift URI of the metastore
    endpoints:
      - name: thrift
        kind: api
        protocol: tcp
        authentication: none
        description: Hive Metastore thrift API
    lifecycle:
      applyTimeout: 10m
      rollback: unsupported
      irreversible: "A newer Hive version upgrades the metastore schema in the database."
    health:
      tcp: { endpoint: thrift }

schema:
  parameters: *parameters

inputs:
  - { contract: database-server, alias: db, fromParameter: db }
  - { contract: s3, alias: storage, fromParameter: storage }

modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/hive-metastore
        tag: 1.4.0
    values: |
      replicaCount: 1
      image:
        repository: quay.io/okdp/hive-metastore
        tag: 4.0.1
        pullPolicy: IfNotPresent

      logLevel: INFO
      serviceName: {{ .Release.metadata.name }}

      db:
        driverRef: {{ .Inputs.db.driver }}
        driverName: {{ .Inputs.db.engine }}
        host: {{ .Inputs.db.host }}
        port: {{ .Inputs.db.port }}
        databaseName: {{ .Inputs.db.dbName }}
        user:
          name: ~
          password:
            secretName: {{ .Inputs.db.secretRef }}
            propertyName: password

      extraEnvRaw:
      - name: HIVEMS_USER
        valueFrom:
          secretKeyRef:
            name: {{ .Inputs.db.secretRef }}
            key: username
      - name: THRIFT_LISTENING_PORT
        value: "9083"

      cloud_storage: "s3"
      s3:
        url: {{ .Inputs.storage.apiUrl }}
        # Misleading issue on hive-metastore chart, warehouseDirectory is a bucket (prefix not available)
        warehouseDirectory: {{ .Parameters.warehouseBucket }}
        accessKey:
          secretName: {{ .Parameters.s3SecretRef }}
          propertyName: accessKey
        secretKey:
          secretName: {{ .Parameters.s3SecretRef }}
          propertyName: secretKey
      gcs:
        enabled: false

      resources:
        requests:
          cpu: "{{ .Parameters.cpu }}"
          memory: "{{ .Parameters.memoryGi }}Gi"
        limits:
          cpu: "{{ mulf (float64 .Parameters.cpu) 2 }}"
          memory: "{{ mulf (float64 .Parameters.memoryGi) 2 }}Gi"
outputs:
  - name: metastore
    contract: hive
    values:
      thriftUri: "thrift://{{ .Release.metadata.name }}.{{ .Release.spec.targetNamespace }}.svc.cluster.local:9083"
roles:
  - okdp.io/hive-metastore
  - okdp.io/data-catalog
