apiVersion: v1alpha1
name: superset
tag: 2.0.0 # x-release-please-version
description: |
  Apache Superset - Enterprise business intelligence platform for modern data teams.
  Self-service analytics tool that enables users to create interactive dashboards, explore datasets,
  and build data visualizations without coding. Integrates with popular databases and supports SQL Lab.
usage:
  text: |
    Apache Superset provides modern data visualization and exploration capabilities.
    Access the UI at https://superset-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 6.0.0
    displayName: Apache Superset
    description: Dashboards and data exploration of a project, on its Trino catalogs
    category: bi
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://superset.apache.org/docs/intro
    maintainer: OKDP
    keywords: [superset, dashboards, bi]
    capabilities:
      - name: okdp.io/bi
    dependencies:
      - capability: okdp.io/ingress
        providerScope: system-wide
      - capability: okdp.io/certificate-manager
        providerScope: system-wide
      - capability: okdp.io/identity-provider
        providerScope: system-wide
      - capability: okdp.io/platform-tools
        providerScope: system-wide
      - capability: okdp.io/secrets-backend
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [metadataDb, examplesDb]
      properties:
        metadataDb:
          type: string
          minLength: 1
          title: Metadata database
          description: "Name of the database-server Connection hosting the Superset metadata."
          x-okdp-group: Cluster
          x-okdp-order: 1
          x-okdp-connection: metadata-db
        load_examples:
          type: boolean
          default: true
          title: Load examples
          description: "Whether to load superset examples"
          x-okdp-group: Cluster
          x-okdp-order: 2
        examplesDb:
          type: string
          minLength: 1
          title: Examples database
          description: "Name of the database-server Connection hosting the Superset examples, used when load_examples is true."
          x-okdp-group: Cluster
          x-okdp-order: 3
          x-okdp-connection: examples-db
        # Chart number and date formats. Any CLDR locale works, the tables come from Babel
        locale:
          type: string
          minLength: 1
          default: "en"
          title: Chart locale
          description: "CLDR locale used by charts to render numbers and dates, for instance en, fr, fr-CH or es. The UI language is not affected."
          x-okdp-group: Cluster
          x-okdp-order: 4
          x-okdp-advanced: true
        currency:
          type: string
          default: ""
          title: Chart currency
          description: "ISO 4217 code, for instance EUR. Defaults to the currency of the locale territory when the locale carries one."
          x-okdp-group: Cluster
          x-okdp-order: 5
          x-okdp-advanced: true
        d3Format:
          type: object
          additionalProperties: true
          title: Number format overrides
          description: "d3-format locale definition, applied over the one derived from locale. See https://github.com/d3/d3-format#formatLocale"
          x-okdp-group: Cluster
          x-okdp-order: 6
          x-okdp-advanced: true
          x-okdp-widget: yaml
        d3TimeFormat:
          type: object
          additionalProperties: true
          title: Date format overrides
          description: "d3-time-format locale definition, applied over the one derived from locale. See https://github.com/d3/d3-time-format#timeFormatLocale"
          x-okdp-group: Cluster
          x-okdp-order: 7
          x-okdp-advanced: true
          x-okdp-widget: yaml
        cpu:
          type: number
          default: 0.5
          multipleOf: 0.25
          title: CPU (vCPU)
          x-okdp-group: Sizing
          x-okdp-order: 1
          x-okdp-advanced: true
        memoryGi:
          type: number
          default: 2
          multipleOf: 0.25
          title: Memory (GiB)
          x-okdp-group: Sizing
          x-okdp-order: 2
          x-okdp-advanced: true
        workers:
          type: integer
          minimum: 1
          default: 2
          title: Server workers
          x-okdp-group: Sizing
          x-okdp-order: 3
          x-okdp-advanced: true
        access:
          type: object
          additionalProperties: false
          title: Access
          description: "Groups granted each Superset role, matched against the groups claim."
          properties:
            Admin: { type: array, items: { type: string, minLength: 1 } }
            Alpha: { type: array, items: { type: string, minLength: 1 } }
            Gamma: { type: array, items: { type: string, minLength: 1 } }
            sql_lab: { type: array, items: { type: string, minLength: 1 } }
          x-okdp-group: Authentication
          x-okdp-order: 6
        # Each datasource wires its own Trino connection and catalog. The name is
        # the display name in the Superset UI.
        datasources:
          type: array
          title: Trino datasources
          x-okdp-group: Datasources
          x-okdp-order: 1
          items:
            type: object
            additionalProperties: false
            required: [name, trino, catalog]
            properties:
              name: { type: string, minLength: 1 }
              trino: { type: string, minLength: 1, description: "Name of the trino Connection of this datasource.", x-okdp-connection: trino }
              catalog: { type: string, minLength: 1, description: "Trino catalog to expose, as named on the Trino instance." }
    connections:
      consumes:
        - name: metadata-db
          contract: database-server
          version: "1"
          description: Database hosting the Superset metadata
        - name: examples-db
          contract: database-server
          version: "1"
          description: Database hosting the Superset examples
        - name: trino
          contract: trino
          version: "1"
          description: Trino instance of each datasource
    endpoints:
      - name: ui
        kind: ui
        protocol: http
        authentication: oidc
        description: Superset web UI and SQL Lab
    sideEffects:
      external:
        - kind: identity-client
          description: OIDC client registered through dynamic client registration when the platform provisions clients that way
    lifecycle:
      applyTimeout: 10m
      rollback: unsupported
      irreversible: "The init job upgrades the metadata database schema, which an older Superset cannot use."
    health:
      http: { endpoint: ui, path: /health }

schema:
  parameters: *parameters
  context:
    properties:
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          enabled: { type: boolean, default: true }
          displayName: { type: string, default: keycloak }
          scope: { type: string, default: "openid profile email groups" }
          usePKCE: { type: boolean, default: true }
          clientProvisioning: { type: string, default: dcr }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }

inputs:
  - { contract: database-server, alias: metadata-db, fromParameter: metadataDb }
  - { contract: database-server, alias: examples-db, fromParameter: examplesDb }
  - { contract: trino, alias: trino, fromParameter: "datasources[].trino" }

modules:
  # Registers the OIDC client through anonymous Dynamic Client Registration.
  # Active only when the platform provisions clients that way; the credentials
  # land in a Secret carrying the same keys the deployment reads.
  - name: oidc-dcr
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "dcr") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        redirect_uris:
          - "https://superset-{{ $namespace }}.{{ .Context.ingress.suffix }}/oauth-authorized/{{ .Context.oidc.displayName | default "keycloak" }}"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        # openid is rejected by Keycloak here.
        scope: {{ without (splitList " " (.Context.oidc.scope | default "openid profile email groups")) "openid" | join " " | quote }}
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"
          client_secret: ".client_secret"

  # The client Superset obtains Trino tokens with. After oidc-dcr: both write
  # their hook objects under the same names.
  - name: oidc-dcr-trino
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}'
    dependsOn:
      - oidc-dcr
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "dcr") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}-trino"
        redirect_uris:
          - "https://superset-{{ $namespace }}.{{ .Context.ingress.suffix }}/api/v1/database/oauth2/"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        # openid is rejected by Keycloak here.
        scope: {{ without (splitList " " (.Context.oidc.scope | default "openid profile email groups")) "openid" | join " " | quote }}
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr-trino"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"
          client_secret: ".client_secret"

  - name: internal-secrets
    source:
      local:
        path: ../../../charts/internal-secrets
    values: |
      secrets:
        - name: "creds-{{ .Release.metadata.name }}-internal"
          fields:
            - fieldName: superset_secret_key
              encoding: base64
              length: "42"
            # hex: the password lands in a redis:// URL, where base64 padding would need escaping.
            - fieldName: redis-password
              encoding: hex
              length: "32"
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/superset
        tag: 0.15.2-2.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $metadataDb := index .Inputs "metadata-db" -}}
      {{- $examplesDb := index .Inputs "examples-db" -}}
      {{- $oidcEnabled := true -}}
      {{- if hasKey .Context.oidc "enabled" }}{{- $oidcEnabled = .Context.oidc.enabled -}}{{ end -}}
      {{- $oidcUsePKCE := true -}}
      {{- if hasKey .Context.oidc "usePKCE" }}{{- $oidcUsePKCE = .Context.oidc.usePKCE -}}{{ end -}}
      {{- $oidcScope := .Context.oidc.scope | default "openid profile email groups" -}}
      {{- $oidcDisplayName := .Context.oidc.displayName | default "keycloak" -}}
      {{- $oauthSecret := printf "creds-%s-oauth2" $release -}}
      {{- $trinoOauthSecret := printf "creds-%s-oauth2-trino" $release -}}
      {{- if eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}
      {{- $oauthSecret = printf "%s-%s-dcr" $release $namespace -}}
      {{- $trinoOauthSecret = printf "%s-%s-dcr-trino" $release $namespace -}}
      {{- end }}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- /* The examples loader is postgresql specific (psycopg2 dialect, main search_path) */ -}}
      {{- $examplesDatabaseJdbcUrl := printf "postgresql+psycopg2://$DB_EXAMPLES_USER:$DB_EXAMPLES_PASS@%s:%v/%s?options=-csearch_path%%3Dmain" $examplesDb.host $examplesDb.port $examplesDb.dbName -}}

      {{- /* The oidc connection resolved from the platform context */ -}}
      {{- $oidcBaseUrl := printf "%s/protocol/openid-connect" .Context.oidc.issuerUri -}}

      {{- $supersetGroupRoles := dict }}
      {{- range $role, $groups := (.Parameters.access | default dict) }}
      {{- range $groups }}{{ $_ := set $supersetGroupRoles . (append (get $supersetGroupRoles . | default list) $role) }}{{ end }}
      {{- end }}

      {{- $supersetHost := printf "superset-%s.%s" $namespace $domain -}}

      {{- $d3FormatOverrides := .Parameters.d3Format | default dict -}}
      {{- $d3TimeFormatOverrides := .Parameters.d3TimeFormat | default dict -}}

      okdp:
        # Superset configuration
        superset:
          superset_secret_key: ~
          extra_config: &extra_config |
            from datetime import timedelta
            # Set up max age of session to 8 hours
            PERMANENT_SESSION_LIFETIME = timedelta(hours=8)
            # This will make sure the redirect_uri is properly computed, even with SSL offloading
            ENABLE_PROXY_FIX = True
            PROXY_FIX_CONFIG = {
              "x_for": 1,
              "x_proto": 1,
              "x_host": 1,
              "x_port": 1,
              "x_prefix": 1,
            }
            # Chart number and date formats. The locale tables are read from CLDR through
            # Babel, a Superset dependency, so that none has to be maintained in this package
            import json

            D3_LOCALE = {{ .Parameters.locale | default "" | quote }}
            D3_CURRENCY = {{ .Parameters.currency | default "" | quote }}
            D3_FORMAT = {}
            D3_TIME_FORMAT = {}

            if D3_LOCALE:
                import logging
                import re
                from babel import Locale
                from babel.numbers import get_currency_symbol, get_territory_currencies

                # CLDR short patterns carry a two digit year, unreadable on a chart axis
                _LDML_TO_STRFTIME = [
                    ("yyyy", "%Y"), ("yy", "%Y"), ("y", "%Y"), ("MMMM", "%B"), ("MMM", "%b"),
                    ("MM", "%m"), ("M", "%-m"), ("dd", "%d"), ("d", "%-d"), ("EEEE", "%A"),
                    ("EEE", "%a"), ("HH", "%H"), ("H", "%-H"), ("hh", "%I"), ("h", "%-I"),
                    ("mm", "%M"), ("ss", "%S"), ("a", "%p"),
                ]

                def _strftime(pattern):
                    out, index = "", 0
                    while index < len(pattern):
                        for ldml, directive in _LDML_TO_STRFTIME:
                            if pattern.startswith(ldml, index):
                                out, index = out + directive, index + len(ldml)
                                break
                        else:
                            out, index = out + pattern[index], index + 1
                    return out

                try:
                    _locale = Locale.parse(D3_LOCALE, sep="-")
                    _symbols = _locale.number_symbols["latn"]
                    D3_FORMAT = {
                        "decimal": _symbols["decimal"],
                        "thousands": _symbols["group"],
                        "grouping": [3],
                    }
                    _currency = D3_CURRENCY or (
                        get_territory_currencies(_locale.territory)[0] if _locale.territory else ""
                    )
                    if _currency:
                        _symbol = get_currency_symbol(_currency, locale=_locale)
                        _affixes = re.split(
                            r"[#0][#0,.]*", _locale.currency_formats["standard"].pattern
                        )
                        D3_FORMAT["currency"] = [
                            _affixes[0].replace("\u00a4", _symbol),
                            _affixes[-1].replace("\u00a4", _symbol),
                        ]
                    # d3 has no spacing rule of its own, the percent sign carries it
                    _spacing = re.search(r"0(\D*?)%", _locale.percent_formats[None].pattern)
                    if _spacing and _spacing.group(1):
                        D3_FORMAT["percent"] = _spacing.group(1) + "%"
                    _date = _strftime(_locale.date_formats["short"].pattern)
                    _time = _strftime(_locale.time_formats["medium"].pattern)
                    _periods = _locale.day_periods["format"]["wide"]
                    _days, _months = _locale.days["format"], _locale.months["format"]
                    D3_TIME_FORMAT = {
                        "dateTime": "%s, %s" % (_date, _time),
                        "date": _date,
                        "time": _time,
                        "periods": [_periods.get("am", "AM"), _periods.get("pm", "PM")],
                        "days": [_days["wide"][(i + 6) % 7] for i in range(7)],
                        "shortDays": [_days["abbreviated"][(i + 6) % 7] for i in range(7)],
                        "months": [_months["wide"][i] for i in range(1, 13)],
                        "shortMonths": [_months["abbreviated"][i] for i in range(1, 13)],
                    }
                except Exception:
                    # A formatting detail must never keep the instance from starting
                    logging.getLogger(__name__).exception(
                        "Falling back to the default formats, unusable locale %s", D3_LOCALE
                    )
                    D3_FORMAT, D3_TIME_FORMAT = {}, {}

            D3_FORMAT.update(json.loads(r'''{{ $d3FormatOverrides | toJson }}'''))
            D3_TIME_FORMAT.update(json.loads(r'''{{ $d3TimeFormatOverrides | toJson }}'''))
          feature_flags: &feature_flags |
            # https://github.com/apache/superset/blob/master/RESOURCES/FEATURE_FLAGS.md
            FEATURE_FLAGS = {
              "DASHBOARD_RBAC": True,
              "EMBEDDED_SUPERSET": True,
              "EMBEDDABLE_CHARTS": True,
              "ENABLE_TEMPLATE_PROCESSING": True,
              "DASHBOARD_NATIVE_FILTERS": True,
              "DASHBOARD_CROSS_FILTERS": True,
            }
          load_examples:
            enabled: {{ .Parameters.load_examples }}
            jdbc_uri: {{ $examplesDatabaseJdbcUrl }}

        # Oauth2 configuration
        oauth:
          enabled: {{ $oidcEnabled }}
          provider: "{{ $oidcDisplayName }}"
          base_url: {{ $oidcBaseUrl }}
          scope: "{{ $oidcScope }}"
          use_pkce: {{ $oidcUsePKCE }}
          auth_registration: &auth_registration |
            AUTH_USER_REGISTRATION = True
            AUTH_ROLE_PUBLIC = "Public"
            AUTH_USER_REGISTRATION_ROLE = "Public"
            AUTH_ROLES_SYNC_AT_LOGIN = True
          oauth2_superset_roles_mapping: &oauth2_superset_roles_mapping |
            AUTH_ROLES_MAPPING = {
            {{- range $group, $supersetRoles := $supersetGroupRoles }}
              {{ $group | quote }}: {{ $supersetRoles | toJson }},
            {{- end }}
            }

        trino:
          oauth:
            enabled: {{ $oidcEnabled }}
            base_url: {{ $oidcBaseUrl }}
            scope: "{{ $oidcScope }}"

      superset:
        image:
          repository: quay.io/okdp/superset
          tag: 6.0.0
          pullPolicy: IfNotPresent
        initImage:
          repository: quay.io/okdp/superset
          tag: 6.0.0-dockerize
          pullPolicy: IfNotPresent
        supersetWebsockets:
          image:
            repository: quay.io/okdp/superset
            tag: 6.0.0-websocket
            pullPolicy: IfNotPresent

        extraConfigs:
          import_datasources.yaml: |
            databases:
            {{- range $i, $d := .Parameters.datasources }}
              - database_name: {{ $d.name }}
                sqlalchemy_uri: "{{ (index $.InputLists "trino" $i).uri }}/{{ $d.catalog }}"
                impersonate_user: true
                extra: |
                  {
                    "engine_params": {},
                    "metadata_params": {},
                    "connect_args": {
                      "http_scheme": "https",
                      "verify": false
                    },
                    "metadata_cache_timeout": {},
                    "schemas_allowed_for_file_upload": []
                  }
                allow_run_async: true
                allow_dml: true
                allow_ctas: true
                allow_cvas: true
                expose_in_sqllab: true
                tables: []
            {{- end }}
        postgresql:
          # Use an external database
          enabled: false
        # If no existing redis cache provided, enable to use the bitnami redis cache
        # The credentials should match 'superset.supersetNode.connections'
        redis:
          enabled: true
          architecture: standalone
          auth:
            enabled: true
            existingSecret: {{ printf "creds-%s-internal" $release }}
            existingSecretPasswordKey: redis-password
        extraEnvRaw:
          # Superset secret key
          - name: SUPERSET_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ printf "creds-%s-internal" .Release.metadata.name }}
                key: superset_secret_key
          # Superset/DB credentials
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: {{ $metadataDb.secretRef }}
                key: username
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: {{ $metadataDb.secretRef }}
                key: password
          # Superset/Redis credentials
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ printf "creds-%s-internal" $release }}
                key: redis-password
          {{- if $oidcEnabled }}
          # OIDC credentials
          - name: AUTH_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ $oauthSecret }}
                key: client_id
          - name: AUTH_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ $oauthSecret }}
                key: client_secret
          # OIDC Trino credentials
          - name: TRINO_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ $trinoOauthSecret }}
                key: client_id
          - name: TRINO_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ $trinoOauthSecret }}
                key: client_secret
          {{- end }}
          # CA
          - name: REQUESTS_CA_BUNDLE
            value: /cacerts/ca.crt

          {{- if .Context.proxy.httpProxy }}
          - name: HTTP_PROXY
            value: {{ .Context.proxy.httpProxy | quote }}
          {{- end }}
          {{- if .Context.proxy.httpsProxy }}
          - name: HTTPS_PROXY
            value: {{ .Context.proxy.httpsProxy | quote }}
          {{- end }}
          {{- if .Context.proxy.noProxy }}
          - name: NO_PROXY
            value: {{ .Context.proxy.noProxy | quote }}
          {{- end }}
          # Examples
          {{- if .Parameters.load_examples }}
          - name: DB_EXAMPLES_HOST
            value: {{ $examplesDb.host }}
          - name: DB_EXAMPLES_PORT
            value: "{{ $examplesDb.port }}"
          - name: DB_EXAMPLES_NAME
            value: {{ $examplesDb.dbName }}
          - name: DB_EXAMPLES_USER
            valueFrom:
              secretKeyRef:
                name: {{ $examplesDb.secretRef }}
                key: username
          - name: DB_EXAMPLES_PASS
            valueFrom:
              secretKeyRef:
                name: {{ $examplesDb.secretRef }}
                key: password
          {{- end }}

        # The chart waits on the server TCP port, which says nothing about the
        # databases existing: the schema upgrade then fails on a database not
        # created yet, and the job burns its retries.
        init:
          # Without OIDC there is no other way in, so the local admin stays.
          createAdmin: {{ not $oidcEnabled }}
          initContainers:
            - name: wait-for-databases
              image: postgres:16-alpine
              env:
                - name: META_PW
                  valueFrom:
                    secretKeyRef:
                      name: {{ $metadataDb.secretRef }}
                      key: password
                - name: META_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $metadataDb.secretRef }}
                      key: username
                {{- if .Parameters.load_examples }}
                - name: EX_PW
                  valueFrom:
                    secretKeyRef:
                      name: {{ $examplesDb.secretRef }}
                      key: password
                - name: EX_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $examplesDb.secretRef }}
                      key: username
                {{- end }}
              command:
                - /bin/sh
                - -c
                - |
                  until PGPASSWORD="$META_PW" psql -h {{ $metadataDb.host }} -p {{ $metadataDb.port }} -U "$META_USER" -d {{ $metadataDb.dbName }} -c '\q' 2>/dev/null; do
                    echo "waiting for database {{ $metadataDb.dbName }}"; sleep 3
                  done
                  {{- if .Parameters.load_examples }}
                  until PGPASSWORD="$EX_PW" psql -h {{ $examplesDb.host }} -p {{ $examplesDb.port }} -U "$EX_USER" -d {{ $examplesDb.dbName }} -c '\q' 2>/dev/null; do
                    echo "waiting for database {{ $examplesDb.dbName }}"; sleep 3
                  done
                  {{- end }}
                  echo "databases reachable"

        extraEnv:
          SERVER_WORKER_AMOUNT: {{ .Parameters.workers }}

        supersetNode:
          resources:
            limits:
              memory: "{{ .Parameters.memoryGi }}Gi"
              cpu: "{{ .Parameters.cpu }}"
          # Connections to an existing database and cache
          connections:
            # -- PostgreSQL
            db_host: "{{ $metadataDb.host }}"
            db_port: "{{ $metadataDb.port }}"
            db_name: {{ $metadataDb.dbName }}
            db_user: ~
            db_pass: ~
            # -- Redis
            redis_host: {{ printf "%s-main-redis-headless" $release | quote }}
            redis_port: 6379
            redis_user: ~
            # Flag only: the chart switches the URL to its authenticated form,
            # which reads the value from the REDIS_PASSWORD variable below.
            redis_password: "set-from-env"
            redis_cache_db: "1"
            redis_celery_db: "0"
            redis_ssl:
              enabled: false
              ssl_cert_reqs: CERT_NONE

        ingress:
          enabled: true
          ingressClassName: {{ .Context.ingress.className }}
          annotations:
            kubernetes.io/ingress.class: {{ .Context.ingress.className }}
            cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
            acme.cert-manager.io/http01-edit-in-place: "true"
            # kubernetes.io/tls-acme: "true"
            ## Extend timeout to allow long running queries.
            nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
          path: /
          pathType: ImplementationSpecific
          hosts:
            - {{ $supersetHost }}
          tls:
            - hosts:
                - {{ $supersetHost }}
              secretName: "{{ $release }}-tls-secret"

        configOverrides:
          auth_registration: *auth_registration
          oauth_to_superset_roles_mapping: *oauth2_superset_roles_mapping
          extra_config: *extra_config
          feature_flags: *feature_flags

        extraVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        extraVolumeMounts:
          - name: cacerts
            mountPath: /cacerts

roles:
  - okdp.io/bi
dependencies:
  - okdp.io/ingress
  - okdp.io/certificate-manager
  - okdp.io/identity-provider
  - okdp.io/platform-tools
  - okdp.io/secrets-backend
