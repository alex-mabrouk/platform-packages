apiVersion: v1alpha1
name: spark-operator
tag: 2.0.0 # x-release-please-version
description: |
  Spark Operator 2.4.0 - Kubernetes operator for managing Apache Spark applications

  This package provides the Kubeflow Spark Operator which simplifies running Spark applications
  on Kubernetes using custom resources (SparkApplication CRD). It supports Spark 2.3+.
usage:
  text: |
    Spark Operator has been deployed successfully.

    The operator manages SparkApplication custom resources in configured namespaces.
    
    To submit a Spark application:
    1. Create a namespace for your Spark applications (e.g., spark-apps)
    2. Create a ServiceAccount with appropriate RBAC permissions
    3. Submit a SparkApplication manifest
    
    Example SparkApplication:
    ```yaml
    apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata:
      name: spark-pi
      namespace: spark-apps
    spec:
      type: Scala
      mode: cluster
      image: "quay.io/okdp/spark-py:spark-3.5.6-python-3.11-scala-2.12-java-17"
      imagePullPolicy: Always
      mainClass: org.apache.spark.examples.SparkPi
      mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.5.6.jar"
      sparkVersion: "3.5.6"
      restartPolicy:
        type: Never
      driver:
        cores: 1
        coreLimit: "1200m"
        memory: "512m"
        serviceAccount: spark
      executor:
        cores: 1
        instances: 2
        memory: "512m"
    ```
    
    Monitor your application using:
    kubectl get sparkapplications -n spark-apps
    kubectl describe sparkapplication spark-pi -n spark-apps

# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 2.4.0
    displayName: Spark Operator
    description: Kubernetes operator running Apache Spark applications from SparkApplication resources
    category: processing
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://www.kubeflow.org/docs/components/spark-operator/
    maintainer: OKDP
    keywords: [spark, operator]
    capabilities:
      - name: okdp.io/operator/sparkoperator.k8s.io
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties:
        controllerReplicas:
          type: integer
          minimum: 1
          default: 1
          title: Replicas
          x-okdp-group: Controller
          x-okdp-order: 1
        controllerLogLevel:
          type: string
          enum: [debug, info, warn, error]
          default: info
          title: Log level
          x-okdp-group: Controller
          x-okdp-order: 2
        controllerWorkers:
          type: integer
          minimum: 1
          default: 10
          title: Workers
          x-okdp-group: Controller
          x-okdp-order: 3
          x-okdp-advanced: true
        jobNamespaces:
          type: array
          items: { type: string }
          title: Job namespaces
          description: "List of namespaces where Spark jobs can run. If empty string is included, all namespaces will be allowed"
          x-okdp-group: Controller
          x-okdp-order: 4
        webhookEnabled:
          type: boolean
          default: true
          title: Admission webhook
          description: "Enable admission webhook for validation and mutation"
          x-okdp-group: Controller
          x-okdp-order: 5
          x-okdp-advanced: true
        metricsEnabled:
          type: boolean
          default: true
          title: Enable metrics
          description: "Enable Prometheus metrics"
          x-okdp-group: Monitoring
          x-okdp-order: 1
        podMonitorEnabled:
          type: boolean
          default: false
          title: Create PodMonitor
          description: "Create PodMonitor for metrics collection. Needs metricsEnabled."
          x-okdp-group: Monitoring
          x-okdp-order: 2
      if:
        properties:
          metricsEnabled: { const: false }
        required: [metricsEnabled]
      then:
        properties:
          podMonitorEnabled: { const: false }
    sideEffects:
      clusterResources:
        - { kind: CustomResourceDefinition, name: sparkapplications.sparkoperator.k8s.io }
        - { kind: CustomResourceDefinition, name: scheduledsparkapplications.sparkoperator.k8s.io }
        - { kind: CustomResourceDefinition, name: sparkconnects.sparkoperator.k8s.io }
    lifecycle:
      applyTimeout: 10m
      rollback: supported

schema:
  parameters: *parameters
  context:
    properties: {}

modules:
  - name: noname
    timeout: 10m
    source:
      helmRepository:
        url: https://kubeflow.github.io/spark-operator
        chart: spark-operator
        version: 2.4.0
    values: |
      # Helm hook configuration
      hook:
        upgradeCrd: false

      # Prometheus metrics configuration
      prometheus:
        metrics:
          enable: {{ .Parameters.metricsEnabled }}
        podMonitor:
          create: {{ .Parameters.podMonitorEnabled }}

      # Controller RBAC
      controller:
        replicas: {{ .Parameters.controllerReplicas }}
        logLevel: "{{ .Parameters.controllerLogLevel }}"
        workers: {{ .Parameters.controllerWorkers }}
        rbac:
          create: true
        podSecurityContext:
          fsGroup: null

      # Webhook configuration
      webhook:
        enable: {{ .Parameters.webhookEnabled }}
        podSecurityContext:
          fsGroup: null

      # Spark application configuration
      spark:
        # List of namespaces where to run spark jobs
        # If empty string is included, all namespaces will be allowed
        # Make sure the namespaces already exist.
        jobNamespaces: {{ .Parameters.jobNamespaces | default (list) | toJson }}

        serviceAccount:
          # Specifies whether to create a service account for spark applications
          create: false

        rbac:
          # Specifies whether to create RBAC resources for spark applications
          create: false

roles:
  - okdp.io/operator/sparkoperator.k8s.io
