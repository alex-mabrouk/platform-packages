apiVersion: v1alpha1
name: airflow
tag: 2.0.0-alpha.3 # x-release-please-version
description: |
  Apache Airflow 3.2.2 - Workflow orchestration platform with Spark Operator integration

usage:
  text: |
    Apache Airflow release has been applied successfully.
    Pods, ingress, and certificate provisioning may still take a few minutes.

    Access the Airflow UI:
      URL: https://airflow-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
      Authenticate via the configured OIDC provider.

# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 3.2.2
    displayName: Apache Airflow
    description: Scheduling and running the data pipelines of a project, with the Kubernetes executor
    category: orchestration
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://airflow.apache.org/docs/apache-airflow/3.2.2/
    maintainer: OKDP
    keywords: [airflow, workflow, dag]
    capabilities:
      - name: okdp.io/workflow-orchestration
    dependencies:
      - capability: okdp.io/ingress
        providerScope: system-wide
      - capability: okdp.io/certificate-manager
        providerScope: system-wide
      - capability: okdp.io/identity-provider
        providerScope: system-wide
      - capability: okdp.io/platform-tools
        providerScope: system-wide
      - capability: okdp.io/secrets-backend
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [db, metadataSecret, storage, s3SecretRef]
      properties:
        db:
          type: string
          minLength: 1
          title: Metadata database
          description: "Name of the database-server Connection hosting the Airflow metadata database. Airflow waits for it; the connection string comes from metadataSecret."
          x-okdp-group: Cluster
          x-okdp-order: 2
          x-okdp-connection: db
        metadataSecret:
          type: string
          minLength: 1
          title: Metadata connection secret
          description: "Secret with key connection holding the full SQLAlchemy connection string."
          x-okdp-group: Cluster
          x-okdp-order: 3
          x-okdp-secret-ref: true
        # CeleryExecutor is left out: it needs a broker and workers, and this package
        # pins workers.replicas to 0 with no Redis.
        schedulerMemoryGi:
          type: number
          default: 1
          multipleOf: 0.25
          title: Scheduler memory (GiB)
          x-okdp-group: Sizing
          x-okdp-order: 1
          x-okdp-advanced: true
        webserverMemoryGi:
          type: number
          default: 1
          multipleOf: 0.25
          title: Webserver memory (GiB)
          x-okdp-group: Sizing
          x-okdp-order: 2
          x-okdp-advanced: true
        dagProcessorMemoryGi:
          type: number
          default: 1
          multipleOf: 0.25
          title: DAG processor memory (GiB)
          x-okdp-group: Sizing
          x-okdp-order: 3
          x-okdp-advanced: true
        dagProcessorCpuCores:
          type: number
          default: 0.75
          multipleOf: 0.05
          title: DAG processor CPU (cores)
          x-okdp-group: Sizing
          x-okdp-order: 4
          x-okdp-advanced: true
        access:
          type: object
          additionalProperties: false
          title: Access
          description: "Groups granted each Airflow role, matched against the groups claim."
          properties:
            Admin: { type: array, items: { type: string, minLength: 1 } }
            Op: { type: array, items: { type: string, minLength: 1 } }
            User: { type: array, items: { type: string, minLength: 1 } }
            Viewer: { type: array, items: { type: string, minLength: 1 } }
          x-okdp-group: Authentication
          x-okdp-order: 4
        storage:
          type: string
          minLength: 1
          title: Object store
          description: "Name of the s3 Connection the DAGs read and write."
          x-okdp-group: Storage
          x-okdp-order: 5
          x-okdp-connection: storage
        s3SecretRef:
          type: string
          minLength: 1
          title: S3 credentials secret
          description: "Secret with keys accessKey and secretKey granting the DAGs access to the object store."
          x-okdp-group: Storage
          x-okdp-order: 6
          x-okdp-secret-ref: true
        # Free-form: any chart dags.gitSync value can be set (enabled, repo, branch,
        # ref, depth, subPath, period, ...).
        dagsGitSync:
          type: object
          additionalProperties: true
          title: Git sync
          description: "Chart dags.gitSync values. credentialsSecret.name carries the git credentials Secret name."
          x-okdp-group: DAGs
          x-okdp-order: 1
          x-okdp-widget: yaml
          properties:
            credentialsSecret:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, x-okdp-secret-ref: true }
    connections:
      consumes:
        - name: db
          contract: database-server
          version: "1"
          description: Database hosting the Airflow metadata, waited for before the deployment
        - name: storage
          contract: s3
          version: "1"
          description: Object store the DAGs read and write
    endpoints:
      - name: ui
        kind: ui
        protocol: http
        authentication: oidc
        description: Airflow web UI and REST API
    sideEffects:
      external:
        - kind: identity-client
          description: OIDC client registered through dynamic client registration when the platform provisions clients that way
    lifecycle:
      applyTimeout: 15m
      rollback: unsupported
      irreversible: "The migration job upgrades the metadata database schema, which an older Airflow cannot use."
    health:
      http: { endpoint: ui, path: /api/v2/monitor/health }

schema:
  parameters: *parameters
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          authUrl: { type: string, required: true }
          tokenUrl: { type: string, required: true }
          enabled: { type: boolean, default: true }
          scope: { type: string, default: "openid profile email groups" }
          insecureSkipVerify: { type: boolean, default: false }
          clientProvisioning: { type: string, default: dcr }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }

inputs:
  - { contract: database-server, alias: db, fromParameter: db }
  - { contract: s3, alias: storage, fromParameter: storage }

modules:
  # Registers the OIDC client through anonymous Dynamic Client Registration.
  # Active only when the platform provisions clients that way; the credentials
  # land in a Secret carrying the same keys the deployment reads.
  - name: oidc-dcr
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "dcr") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        redirect_uris:
          - "https://airflow-{{ $namespace }}.{{ .Context.ingress.suffix }}/auth/oauth-authorized/oidc"
        grant_types:
          - "authorization_code"
          - "client_credentials"
        # openid is rejected by Keycloak here; offline_access must match the login scope below.
        scope: {{ append (without (splitList " " (.Context.oidc.scope | default "openid profile email groups")) "openid") "offline_access" | join " " | quote }}
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"
          client_secret: ".client_secret"

  - name: internal-secrets
    source:
      local:
        path: ../../../charts/internal-secrets
    values: |
      secrets:
        - name: "creds-{{ .Release.metadata.name }}-internal"
          fields:
            - fieldName: api-secret-key
              encoding: base64
              length: "32"
            - fieldName: jwt-secret
              encoding: base64
              length: "64"
  - name: main
    timeout: 15m
    source:
      helmRepository:
        url: https://airflow.apache.org
        chart: airflow
        version: 1.22.0
    values: |
      executor: "KubernetesExecutor"

      defaultAirflowTag: "3.2.2"
      airflowVersion: "3.2.2"

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}
      {{- $airflowHost := printf "airflow-%s.%s" $namespace $domain -}}
      {{- $airflowGitSync := .Parameters.dagsGitSync | default dict }}
      {{- $airflowGitSyncValues := omit $airflowGitSync "credentialsSecret" }}
      {{- /* git-sync v4 lets the deprecated GIT_SYNC_BRANCH, fed by the chart
             default, override GITSYNC_REF. Mirroring ref onto branch keeps the
             modern key in charge. Done even when the caller set both, since
             leaving them to disagree silently serves the wrong revision. */ -}}
      {{- if $airflowGitSyncValues.ref }}
      {{- $_ := set $airflowGitSyncValues "branch" $airflowGitSyncValues.ref }}
      {{- end }}
      {{- $airflowOidcEnabled := true }}
      {{- if hasKey .Context.oidc "enabled" }}{{- $airflowOidcEnabled = .Context.oidc.enabled }}{{ end }}
      {{- /* offline_access here must stay registered by the oidc-dcr module above. */}}
      {{- $airflowOidcScope := printf "%s offline_access" (.Context.oidc.scope | default "openid profile email groups") | replace " " "+" }}
      {{- $airflowDCR := eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}
      {{- /* In dcr mode the registration job writes the credentials, under the same keys. */}}
      {{- $airflowOauthSecret := printf "creds-%s-oauth2" .Release.metadata.name }}
      {{- if $airflowDCR }}{{- $airflowOauthSecret = printf "%s-%s-dcr" .Release.metadata.name .Release.spec.targetNamespace }}{{- end }}
      {{- $airflowGroupRoles := dict }}
      {{- range $role, $groups := (.Parameters.access | default dict) }}
      {{- range $groups }}{{ $_ := set $airflowGroupRoles . (append (get $airflowGroupRoles . | default list) $role) }}{{ end }}
      {{- end }}
      {{- $airflowOidcBaseUrl := "" }}
      {{- $airflowOidcAuthUrl := "" }}
      {{- $airflowOidcTokenUrl := "" }}
      {{- $airflowOidcIssuerUri := "" }}
      {{- if $airflowOidcEnabled }}
        {{- $oidc := .Context.oidc -}}
        {{- $airflowOidcBaseUrl = printf "%s/protocol/openid-connect" $oidc.issuerUri -}}
        {{- $airflowOidcAuthUrl = $oidc.authUrl -}}
        {{- $airflowOidcTokenUrl = $oidc.tokenUrl -}}
        {{- $airflowOidcIssuerUri = $oidc.issuerUri -}}
      {{- end }}

      extraEnv: |
      {{- if $airflowOidcEnabled }}
        - name: AIRFLOW_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $airflowOauthSecret }}
              key: client_id
        - name: AIRFLOW_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $airflowOauthSecret }}
              key: client_secret
        - name: AIRFLOW_OIDC_API_BASE_URL
          value: {{ $airflowOidcBaseUrl | quote }}
        - name: AIRFLOW_OIDC_ACCESS_TOKEN_URL
          value: {{ $airflowOidcTokenUrl | quote }}
        - name: AIRFLOW_OIDC_AUTHORIZE_URL
          value: {{ $airflowOidcAuthUrl | quote }}
        - name: AIRFLOW_OIDC_SERVER_METADATA_URL
          value: {{ printf "%s/.well-known/openid-configuration" $airflowOidcIssuerUri | quote }}
        - name: AIRFLOW_OIDC_SCOPE
          value: {{ $airflowOidcScope | quote }}
      {{- end }}
        - name: AWS_ENDPOINT_URL_S3
          value: {{ .Inputs.storage.internalUrl | quote }}
        - name: AWS_REGION
          value: {{ .Inputs.storage.region | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef | quote }}
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef | quote }}
              key: secretKey
        - name: INSECURE_VERIFY_TLS
          value: {{ if .Context.oidc.insecureSkipVerify }}"false"{{ else }}"true"{{ end }}
        - name: REQUESTS_CA_BUNDLE
          value: "/cacerts/ca.crt"
        - name: SSL_CERT_FILE
          value: "/cacerts/ca.crt"
        - name: CURL_CA_BUNDLE
          value: "/cacerts/ca.crt"

      # The CA bundle the variables above point at, mounted in every Airflow
      # container: a component without it fails any HTTPS call, and the CLI
      # itself talks to the API server over HTTPS.
      volumes:
        - name: cacerts
          secret:
            secretName: certs-bundle
      volumeMounts:
        - name: cacerts
          mountPath: /cacerts

      apiServer:
        # The chart does not roll the API server when apiServerConfig changes.
        podAnnotations:
          checksum/api-server-config: '{{ "{{" }} include (print $.Template.BasePath "/configmaps/api-server-configmap.yaml") . | sha256sum {{ "}}" }}'
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "{{ .Parameters.webserverMemoryGi }}Gi"
            cpu: "1000m"
        startupProbe:
          failureThreshold: 24
          timeoutSeconds: 30
        {{- if $airflowOidcEnabled }}
        apiServerConfig: |
          import os

          from flask_appbuilder.security.manager import AUTH_OAUTH

          verify_tls = os.environ.get("INSECURE_VERIFY_TLS", "true").lower() == "true"
          oauth_verify = os.environ.get("REQUESTS_CA_BUNDLE") if verify_tls else False

          AUTH_TYPE = AUTH_OAUTH
          AUTH_USER_REGISTRATION = True
          AUTH_USER_REGISTRATION_ROLE = "Viewer"
          # Sync Airflow roles from OIDC groups at every login
          AUTH_ROLES_SYNC_AT_LOGIN = True
          # Map OIDC groups to Airflow roles
          AUTH_ROLES_MAPPING = {
          {{- range $group, $airflowRoles := $airflowGroupRoles }}
              {{ $group | quote }}: {{ $airflowRoles | toJson }},
          {{- end }}
          }

          OAUTH_PROVIDERS = [
              {
                  "name": "oidc",
                  "icon": "fa-circle-o",
                  "token_key": "access_token",
                  "remote_app": {
                      "client_id": os.environ["AIRFLOW_OIDC_CLIENT_ID"],
                      "client_secret": os.environ["AIRFLOW_OIDC_CLIENT_SECRET"],
                      "api_base_url": os.environ["AIRFLOW_OIDC_API_BASE_URL"],
                      "access_token_url": os.environ["AIRFLOW_OIDC_ACCESS_TOKEN_URL"],
                      "authorize_url": os.environ["AIRFLOW_OIDC_AUTHORIZE_URL"],
                      "server_metadata_url": os.environ["AIRFLOW_OIDC_SERVER_METADATA_URL"],
                      "client_kwargs": {
                          "scope": os.environ.get("AIRFLOW_OIDC_SCOPE", "openid profile email").replace("+", " "),
                          "verify": oauth_verify,
                      },
                  },
              },
          ]
        {{- end }}

      scheduler:
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "{{ .Parameters.schedulerMemoryGi }}Gi"
            cpu: "1000m"
        startupProbe:
          failureThreshold: 12
          timeoutSeconds: 60

      triggerer:
        enabled: true
        # The default 20s probe times out on small nodes and kills a healthy triggerer.
        livenessProbe:
          timeoutSeconds: 60
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "300m"

      ingress:
        apiServer:
          enabled: true
          ingressClassName: {{ .Context.ingress.className }}
          annotations:
            kubernetes.io/ingress.class: {{ .Context.ingress.className }}
            cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
            nginx.ingress.kubernetes.io/proxy-body-size: "0"

          hosts:
            - name: {{ $airflowHost }}
              tls:
                enabled: true
                secretName: airflow-tls

      # Point to the pre-provisioned secret (via local-secrets-provider) that holds the
      # full SQLAlchemy connection string. The chart skips generating its own airflow-metadata
      # secret, so credentials never appear in the package values.
      data:
        metadataSecretName: {{ .Parameters.metadataSecret }}

      dags:
        mountPath: /opt/airflow/dags
        persistence:
            enabled: false
        gitSync:
          {{- toYaml $airflowGitSyncValues | nindent 4 }}
          {{- with $airflowGitSync.credentialsSecret }}
          credentialsSecret: {{ required "dagsGitSync.credentialsSecret.name is required" .name | quote }}
          {{- end }}
          {{- if or .Context.proxy.httpProxy .Context.proxy.httpsProxy .Context.proxy.noProxy }}
          env:
            {{- if .Context.proxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ .Context.proxy.httpProxy | quote }}
            {{- end }}
            {{- if .Context.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .Context.proxy.httpsProxy | quote }}
            {{- end }}
            {{- if .Context.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ .Context.proxy.noProxy | quote }}
            {{- end }}
          {{- end }}

      dagProcessor:
        enabled: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "{{ .Parameters.dagProcessorMemoryGi }}Gi"
            cpu: "{{ .Parameters.dagProcessorCpuCores }}"
      flower:
        enabled: false
      pgbouncer:
        enabled: false
      statsd:
        enabled: false
      redis:
        enabled: false
      workers:
        replicas: 0
      postgresql:
        enabled: false
      webserver:
        enabled: false
      createUserJob:
        enabled: false
        useHelmHooks: false
        #defaultUser:
        #  enabled: true
        #  role: Admin
        #  username: admin
        #  email: admin@example.com
        #  firstName: admin
        #  lastName: user
        #  password: admin
        #resources:
        #  requests:
        #    memory: "64Mi"
        #   cpu: "25m"
        #  limits:
        #   memory: "256Mi"
        #   cpu: "200m"

      migrateDatabaseJob:
        enabled: true
        useHelmHooks: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      config:
        core:
          load_examples: 'False'
          auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
        fab:
          enable_proxy_fix: "True"
          cookie_secure: "True"
          cookie_samesite: "Lax"

      # The fernet key is left to the chart: it mints it in a pre-install hook,
      # so it is not rotated on upgrades. The generator cannot produce its format.
      apiSecretKeySecretName: {{ printf "creds-%s-internal" .Release.metadata.name }}
      jwtSecretName: {{ printf "creds-%s-internal" .Release.metadata.name }}

roles:
  - okdp.io/workflow-orchestration

dependencies:
  - okdp.io/ingress
  - okdp.io/certificate-manager
  - okdp.io/identity-provider
  - okdp.io/platform-tools
  - okdp.io/secrets-backend
