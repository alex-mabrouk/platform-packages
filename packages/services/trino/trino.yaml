apiVersion: v1alpha1
name: trino
tag: 2.0.0-alpha.3 # x-release-please-version
description: |
  Apache Trino - Distributed SQL query engine designed for large-scale data processing across multiple data sources.
  High-performance, in-memory query engine that enables fast, interactive analytics on diverse data systems.
  Supports querying data from multiple databases, data warehouses, and big data platforms in a single query.
usage:
  text: |
    Apache Trino provides distributed SQL query engine designed for large-scale data processing.
    Access the UI at https://trino-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: "484"
    displayName: Trino
    description: Distributed SQL engine of a project, federating its Hive and Iceberg catalogs
    category: query
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://trino.io/docs/484/
    maintainer: OKDP
    keywords: [trino, sql, query]
    capabilities:
      - name: okdp.io/sql-query
    dependencies:
      - capability: okdp.io/ingress
        providerScope: system-wide
      - capability: okdp.io/certificate-manager
        providerScope: system-wide
      - capability: okdp.io/identity-provider
        providerScope: system-wide
      - capability: okdp.io/platform-tools
        providerScope: system-wide
      - capability: okdp.io/secrets-backend
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      $defs:
        catalogName:
          type: string
          pattern: "^[a-z][a-z0-9_-]*$"
          description: "Trino catalog name."
        secretName:
          type: string
          minLength: 1
          x-okdp-secret-ref: true
      properties:
        hiveCatalogs:
          type: array
          title: Hive catalogs
          description: "Hive catalogs, one Trino catalog per item, each on its own metastore and object store."
          x-okdp-group: Catalogs
          x-okdp-order: 1
          items:
            type: object
            additionalProperties: false
            required: [name, metastore, storage]
            properties:
              name: { $ref: "#/$defs/catalogName" }
              metastore: { type: string, minLength: 1, description: "Name of the hive Connection backing this catalog.", x-okdp-connection: hive-metastore }
              storage: { type: string, minLength: 1, description: "Name of the s3 Connection backing this catalog.", x-okdp-connection: hive-storage }
              s3SecretRef: { $ref: "#/$defs/secretName", description: "S3 identity used against this store. Secret with keys: accessKey, secretKey. Defaults to the instance s3SecretRef." }
        icebergCatalogs:
          type: array
          title: Iceberg REST catalogs
          description: "Iceberg REST catalogs (Polaris), one Trino catalog per item, each on its own object store."
          x-okdp-group: Catalogs
          x-okdp-order: 2
          items:
            type: object
            additionalProperties: false
            required: [name, catalog, storage, oidcSecretRef]
            properties:
              name: { $ref: "#/$defs/catalogName" }
              catalog: { type: string, minLength: 1, description: "Name of the iceberg-catalog Connection.", x-okdp-connection: iceberg-catalog }
              storage: { type: string, minLength: 1, description: "Name of the s3 Connection backing this catalog.", x-okdp-connection: iceberg-storage }
              warehouse: { type: string, minLength: 1, description: "Polaris catalog used as the warehouse. Defaults to the realm published on the connection." }
              oidcSecretRef: { $ref: "#/$defs/secretName", description: "Credentials of the Polaris principal Trino uses against this catalog. Secret with keys: client_id, client_secret." }
              oauth2Scope: { type: string, minLength: 1, default: "PRINCIPAL_ROLE:ALL", description: "OAuth2 scope requested. Polaris rejects the connector default." }
              s3SecretRef: { $ref: "#/$defs/secretName", description: "S3 identity used against this store. Secret with keys: accessKey, secretKey. Defaults to the instance s3SecretRef." }
        s3SecretRef:
          $ref: "#/$defs/secretName"
          title: S3 credentials secret
          description: "Default S3 identity of this instance, used by any catalog that does not name its own. Secret with keys: accessKey, secretKey."
          x-okdp-group: Catalogs
          x-okdp-order: 3
        numWorkers:
          type: integer
          minimum: 0
          default: 1
          title: Workers
          description: "Number of workers"
          x-okdp-group: Sizing
          x-okdp-order: 1
          x-okdp-advanced: true
        workerCpu:
          type: number
          default: 0.5
          multipleOf: 0.25
          title: Worker CPU (vCPU)
          description: "Worker CPU request in vCPU."
          x-okdp-group: Sizing
          x-okdp-order: 2
          x-okdp-advanced: true
        workerMemoryGi:
          type: number
          default: 2
          multipleOf: 0.25
          title: Worker memory (GiB)
          description: "Worker memory (GiB) used for Kubernetes requests/limits (recommended: request=limit)."
          x-okdp-group: Sizing
          x-okdp-order: 3
          x-okdp-advanced: true
        coordinatorMemoryGi:
          type: number
          default: 8
          multipleOf: 0.25
          title: Coordinator memory (GiB)
          x-okdp-group: Sizing
          x-okdp-order: 4
          x-okdp-advanced: true
        enableOPA:
          type: boolean
          default: true
          title: Enable OPA
          description: "Whether to enable OPA."
          x-okdp-group: Authorization
          x-okdp-order: 1
        opaPolicyPath:
          type: string
          minLength: 1
          default: "v1/data/trino/allow"
          title: Policy path
          description: "Path of the OPA policies for Trino used in the Trino variable opa.policy.uri. Used when enableOPA is true."
          x-okdp-group: Authorization
          x-okdp-order: 2
          x-okdp-advanced: true
        enableOPAL:
          type: boolean
          default: false
          title: Enable OPAL
          description: "Whether to enable OPAL. When false, OPA policies are loaded from labeled ConfigMaps by the kube-mgmt sidecar. Needs enableOPA."
          x-okdp-group: Authorization
          x-okdp-order: 3
        policyRepoUrl:
          type: string
          default: "https://github.com/OKDP/okdp-examples.git"
          title: Policy repository
          description: "OPA policy repo URL. Used when enableOPAL is true."
          x-okdp-group: Authorization
          x-okdp-order: 4
          x-okdp-advanced: true
        policyRepoMainBranch:
          type: string
          default: "main"
          title: Policy branch
          description: "OPA policy repo branch. Used when enableOPAL is true."
          x-okdp-group: Authorization
          x-okdp-order: 5
          x-okdp-advanced: true
        OPAL_POLICY_SUBSCRIPTION_DIRS:
          type: string
          default: "trino_opa_policy"
          title: Policy directories
          description: "Policy directories in the repository for which the client will subscribe to, separated by ':'. Used when enableOPAL is true."
          x-okdp-group: Authorization
          x-okdp-order: 6
          x-okdp-advanced: true
        OPAL_POLICY_REPO_MANIFEST_PATH:
          type: string
          default: "trino_opa_policy"
          title: Policy manifest path
          description: "The location of the manifest file in the remote repository. Used when enableOPAL is true."
          x-okdp-group: Authorization
          x-okdp-order: 7
          x-okdp-advanced: true
        enableOPADebugLogs:
          type: boolean
          default: false
          title: Debug logs
          description: "Log OPA status and decision logs to the container console. Verbose, intended for debugging. Used when enableOPA is true."
          x-okdp-group: Authorization
          x-okdp-order: 8
          x-okdp-advanced: true
      if:
        properties:
          enableOPA: { const: false }
        required: [enableOPA]
      then:
        properties:
          enableOPAL: { const: false }
    connections:
      consumes:
        - name: hive-metastore
          contract: hive
          version: "1"
          description: Metastore of each Hive catalog
        - name: hive-storage
          contract: s3
          version: "1"
          description: Object store of each Hive catalog
        - name: iceberg-catalog
          contract: iceberg-catalog
          version: "1"
          description: Iceberg REST catalog of each Iceberg catalog
        - name: iceberg-storage
          contract: s3
          version: "1"
          description: Object store of each Iceberg catalog
      publishes:
        - name: endpoint
          contract: trino
          version: "1"
          description: Trino endpoint and the catalogs it serves
    endpoints:
      - name: ui
        kind: ui
        protocol: http
        authentication: oidc
        description: Trino web UI and client protocol
    sideEffects:
      external:
        - kind: identity-client
          description: OIDC client registered through dynamic client registration when the platform provisions clients that way
    lifecycle:
      applyTimeout: 15m
      rollback: supported
    health:
      http: { endpoint: ui, path: /v1/info }

schema:
  parameters: *parameters
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
          className: { type: string, required: true }
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          authUrl: { type: string, required: true }
          tokenUrl: { type: string, required: true }
          jwksUri: { type: string, required: true }
          scope: { type: string, default: "openid profile email groups" }
          clientProvisioning: { type: string, default: dcr }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }


inputs:
  - { contract: hive, alias: hive-metastore, fromParameter: "hiveCatalogs[].metastore" }
  - { contract: s3, alias: hive-storage, fromParameter: "hiveCatalogs[].storage" }
  - { contract: iceberg-catalog, alias: iceberg-catalog, fromParameter: "icebergCatalogs[].catalog" }
  - { contract: s3, alias: iceberg-storage, fromParameter: "icebergCatalogs[].storage" }

modules:
  - name: internal-secrets
    source:
      local:
        path: ../../../charts/internal-secrets
    values: |
      secrets:
        - name: "creds-{{ .Release.metadata.name }}-internal"
          fields:
            - fieldName: shared-secret
              encoding: base64
              length: "32"
  - name: opa
    enabled: "{{ .Parameters.enableOPA }}"
    timeout: 10m
    source:
      helmRepository:
        url: https://open-policy-agent.github.io/kube-mgmt/charts
        chart: opa-kube-mgmt
        version: 11.0.14
    values: |
      fullnameOverride: {{ .Release.metadata.name }}-opa
      authz:
        enabled: false
      image:
        repository: openpolicyagent/opa
        tag: 1.21.3
        pullPolicy: IfNotPresent
      useHttps: false
      port: 8181
      {{- if .Parameters.enableOPADebugLogs }}
      extraArgs:
        - "--set=status.console=true"
        - "--set=decision_logs.console=true"
      {{- end }}
      mgmt:
        enabled: {{ not .Parameters.enableOPAL }}
        startupProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 20
          successThreshold: 1
          timeoutSeconds: 10
        data:
          enabled: true
        policies:
          enabled: true
      rbac:
        create: {{ not .Parameters.enableOPAL }}
      serviceAccount:
        create: {{ not .Parameters.enableOPAL }}

  - name: opal-secrets
    enabled: "{{ and .Parameters.enableOPA .Parameters.enableOPAL }}"
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/opal-secrets
        tag: 0.1.1
    values: |
      fullnameOverride: {{ .Release.metadata.name }}-opal-secrets
  - name: opal
    enabled: "{{ and .Parameters.enableOPA .Parameters.enableOPAL }}"
    dependsOn:
      - opa
      - opal-secrets
    timeout: 10m
    source:
      helmRepository:
        url: https://permitio.github.io/opal-helm-chart
        chart: opal
        version: 0.0.30
    values: |
      image:
        client:
          registry: docker.io
          repository: permitio/opal-client-standalone
          tag: 0.9.4
        server:
          registry: docker.io
          repository: permitio/opal-server
          tag: 0.9.4

      client:
        extraEnv:
          OPAL_POLICY_STORE_URL: http://{{ .Release.metadata.name }}-opa.{{ .Release.spec.targetNamespace }}:8181
          OPAL_POLICY_SUBSCRIPTION_DIRS: "{{ .Parameters.OPAL_POLICY_SUBSCRIPTION_DIRS }}"
        secrets:
          - opal-client-token-secret

      server:
        policyRepoUrl: "{{ .Parameters.policyRepoUrl }}"
        policyRepoMainBranch: "{{ .Parameters.policyRepoMainBranch }}"
        secrets:
          - opal-ssh-secret
          - opal-master-token-secret

        extraEnv:
          OPAL_POLICY_REPO_MANIFEST_PATH: "{{ .Parameters.OPAL_POLICY_REPO_MANIFEST_PATH }}"
          {{- with .Context.proxy }}
          {{- if or .httpProxy .httpsProxy .noProxy }}
          {{- with .httpProxy }}
          HTTP_PROXY: {{ . | quote }}
          {{- end }}
          {{- with .httpsProxy }}
          HTTPS_PROXY: {{ . | quote }}
          {{- end }}
          {{- with .noProxy }}
          NO_PROXY: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- end }}

  - name: oidc-dcr
    enabled: '{{ eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "dcr") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}
      {{- $oidcRegistrationUrl := $dcr.registrationUrl -}}

      ttl_seconds: 30
      registration_url: "{{ $oidcRegistrationUrl }}"
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        redirect_uris:
          - "https://trino-{{ $namespace }}.{{ $domain }}/oauth2/callback"
        logo_uri: "https://landscape.cncf.io/logos/008125b82108f19aea6b0004ce5f255b72bab5b5e5c169a302d7bf845edb8e6b.svg"
        grant_types:
          - "authorization_code"
          - "client_credentials"
        # Keycloak realm client scopes granted to the registered client.
        scope: "web-origins acr roles profile groups basic email address phone organization offline_access microprofile-jwt"
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          OIDC_CLIENT_ID: ".client_id"
          OIDC_CLIENT_SECRET: ".client_secret"
          OIDC_ISSUER_URL: "{{ $oidcIssuerUri }}"
          OIDC_SCOPES: "{{ .Context.oidc.scope }}"

  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://trinodb.github.io/charts/
        chart: trino
        version: 1.45.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $oidcAuthUrl := .Context.oidc.authUrl -}}
      {{- $oidcTokenUrl := .Context.oidc.tokenUrl -}}
      {{- $oidcJwksUrl := .Context.oidc.jwksUri -}}

      {{- $oidcScopes := (.Context.oidc.scope | default "openid profile email groups") | replace " " "," -}}
      {{- $oauthSecret := printf "creds-%s-oauth2" $release -}}
      {{- $enableDCR := eq (.Context.oidc.clientProvisioning | default "dcr") "dcr" -}}

      {{- $trinoEndpoint := printf "trino-%s.%s" $namespace $domain -}}

      {{- $hiveCatalogs := .Parameters.hiveCatalogs | default list -}}
      {{- $icebergCatalogs := .Parameters.icebergCatalogs | default list -}}
      {{- $defaultS3Secret := .Parameters.s3SecretRef | default "" -}}

      image:
        repository: trinodb/trino
        tag: 484

      {{- if or $hiveCatalogs $icebergCatalogs }}
      catalogs:
        {{- range $i, $c := $hiveCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $c.name) }}
        {{- $metastore := index $.InputLists "hive-metastore" $i }}
        {{- $storage := index $.InputLists "hive-storage" $i }}
        {{ $c.name }}: |
          connector.name=hive
          hive.metastore.uri={{ $metastore.thriftUri }}
          fs.native-s3.enabled=true
          s3.endpoint={{ $storage.apiUrl }}
          s3.path-style-access={{ $storage.pathStyle | default false }}
          s3.region={{ $storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY_{{ $envPrefix }}}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_{{ $envPrefix }}}
        {{- end }}
        {{- range $i, $ic := $icebergCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $ic.name) }}
        {{- $catalog := index $.InputLists "iceberg-catalog" $i }}
        {{- $storage := index $.InputLists "iceberg-storage" $i }}
        {{ $ic.name }}: |
          connector.name=iceberg
          iceberg.catalog.type=rest
          iceberg.rest-catalog.uri={{ $catalog.internalUri | default $catalog.uri }}
          iceberg.rest-catalog.warehouse={{ $ic.warehouse | default $catalog.realm }}
          iceberg.rest-catalog.security=OAUTH2
          iceberg.rest-catalog.oauth2.credential=${ENV:ICEBERG_OAUTH_{{ $envPrefix }}}
          iceberg.rest-catalog.oauth2.scope={{ $ic.oauth2Scope | default "PRINCIPAL_ROLE:ALL" }}
          iceberg.rest-catalog.oauth2.server-uri={{ $catalog.internalUri | default $catalog.uri }}/v1/oauth/tokens
          iceberg.rest-catalog.vended-credentials-enabled=false
          fs.native-s3.enabled=true
          s3.endpoint={{ $storage.apiUrl }}
          s3.path-style-access={{ $storage.pathStyle | default false }}
          s3.region={{ $storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY_{{ $envPrefix }}}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_{{ $envPrefix }}}
        {{- end }}
      {{- end }}

      env:
        - name: TRINO_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              {{- if $enableDCR }}
              name: {{ $release }}-{{ $namespace }}-dcr
              key: OIDC_CLIENT_ID
              {{- else }}
              name: {{ $oauthSecret }}
              key: client_id
              {{- end }}

        - name: TRINO_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              {{- if $enableDCR }}
              name: {{ $release }}-{{ $namespace }}-dcr
              key: OIDC_CLIENT_SECRET
              {{- else }}
              name: {{ $oauthSecret }}
              key: client_secret
              {{- end }}

        {{- range $ic := $icebergCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $ic.name) }}
        - name: ICEBERG_OAUTH_CLIENT_ID_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $ic.oidcSecretRef }}
              key: client_id
        - name: ICEBERG_OAUTH_CLIENT_SECRET_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $ic.oidcSecretRef }}
              key: client_secret
        # Kubernetes expands $(VAR) from variables declared earlier in this list.
        - name: ICEBERG_OAUTH_{{ $envPrefix }}
          value: "$(ICEBERG_OAUTH_CLIENT_ID_{{ $envPrefix }}):$(ICEBERG_OAUTH_CLIENT_SECRET_{{ $envPrefix }})"
        {{- end }}

        - name: TRINO_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ printf "creds-%s-internal" .Release.metadata.name }}
              key: shared-secret

        - name: TRUSTSTORE_PASSWORD
          value: ""

        {{- range $c := concat $hiveCatalogs $icebergCatalogs }}
        {{- $envPrefix := upper (replace "-" "_" $c.name) }}
        {{- $s3Secret := $c.s3SecretRef | default $defaultS3Secret }}
        {{- if not $s3Secret }}{{ fail (printf "catalog %q: no S3 credentials, set s3SecretRef on the catalog or on the release" $c.name) }}{{ end }}
        - name: S3_ACCESS_KEY_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $s3Secret }}
              key: accessKey

        - name: S3_SECRET_ACCESS_{{ $envPrefix }}
          valueFrom:
            secretKeyRef:
              name: {{ $s3Secret }}
              key: secretKey
        {{- end }}

      coordinator:
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "{{ .Parameters.coordinatorMemoryGi }}Gi"

        additionalVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        additionalVolumeMounts:
          - name: cacerts
            mountPath: /cacerts
            readOnly: true

        additionalJVMConfig:
          - "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12"
          - "-Djavax.net.ssl.trustStorePassword=${ENV:TRUSTSTORE_PASSWORD}"

      worker:
        resources:
          requests:
            cpu: "{{ .Parameters.workerCpu }}"
            memory: "{{ .Parameters.workerMemoryGi }}Gi"
          limits:
            cpu: "{{ mulf (float64 .Parameters.workerCpu) 2 }}"
            memory: "{{ mulf (float64 .Parameters.workerMemoryGi) 2 }}Gi"

        additionalVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        additionalVolumeMounts:
          - name: cacerts
            mountPath: /cacerts
            readOnly: true

        additionalJVMConfig:
          - "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12"
          - "-Djavax.net.ssl.trustStorePassword=${ENV:TRUSTSTORE_PASSWORD}"

      ingress:
        enabled: true
        className: {{ .Context.ingress.className }}
        annotations:
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/use-regex: "true"
        hosts:
          - host: {{ $trinoEndpoint }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $trinoEndpoint }}
            secretName: {{ .Release.metadata.name }}-tls

      server:
        workers: {{ .Parameters.numWorkers }}
        node:
          environment: sandbox
        config:
          authenticationType: "oauth2"
          coordinator: "true"
          node-scheduler.include-coordinator: "true"
          discovery-server.enabled: "true"
          path: /etc/trino
          https:
            enabled: false
        workerExtraConfig: ""
        coordinatorExtraConfig: |
          http-server.process-forwarded=true
          web-ui.authentication.type=oauth2
          # Enable two authentication flows on the coordinator:
          # - OAUTH2: interactive browser-based login for human users (UI/CLI with external authentication)
          # - JWT: non-interactive bearer token authentication for automation/service accounts
          #   such as scripts, jobs, or CI/CD using --access-token
          http-server.authentication.type=jwt,oauth2
          # In-cluster clients reach the coordinator on plain HTTP. Without this,
          # Trino answers 403 to any authenticated call that is not TLS.
          http-server.authentication.allow-insecure-over-http=true
          http-server.authentication.oauth2.issuer={{ $oidcIssuerUri }}
          http-server.authentication.oauth2.client-id=${ENV:TRINO_OAUTH_CLIENT_ID}
          http-server.authentication.oauth2.client-secret=${ENV:TRINO_OAUTH_CLIENT_SECRET}
          http-server.authentication.oauth2.auth-url={{ $oidcAuthUrl }}
          http-server.authentication.oauth2.token-url={{ $oidcTokenUrl }}
          http-server.authentication.oauth2.scopes={{ $oidcScopes }}
          http-server.authentication.oauth2.principal-field=preferred_username

          http-server.authentication.jwt.key-file={{ $oidcJwksUrl }}
          http-server.authentication.jwt.required-issuer={{ $oidcIssuerUri }}
          http-server.authentication.jwt.required-audience=account
          http-server.authentication.jwt.principal-field=client_id

      additionalConfigProperties:
        - internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

      {{- if .Parameters.enableOPA }}
      accessControl:
        type: properties
        properties: |
          access-control.name=opa
          opa.policy.uri=http://{{ .Release.metadata.name }}-opa.{{ .Release.spec.targetNamespace }}:8181/{{ .Parameters.opaPolicyPath }}
          opa.log-responses=true
          opa.log-requests=true
      {{- end }}
# One trino Connection per instance, named 'kcd-<release>-endpoint'. Two
# releases of this package = two distinct Connections.
outputs: |
  - name: endpoint
    contract: trino
    values:
      url: "https://trino-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}"
      uri: "trino://trino@trino-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}:443"
      internalUri: "trino://trino@{{ .Release.metadata.name }}-main-trino.{{ .Release.spec.targetNamespace }}.svc.cluster.local:8080"
      catalogs:
        - tpch
        - tpcds
        {{- range $c := (.Parameters.hiveCatalogs | default list) }}
        - "{{ $c.name }}"
        {{- end }}
        {{- range $c := (.Parameters.icebergCatalogs | default list) }}
        - "{{ $c.name }}"
        {{- end }}
roles:
  - okdp.io/sql-query
dependencies:
  - okdp.io/ingress
  - okdp.io/certificate-manager
  - okdp.io/identity-provider
  - okdp.io/platform-tools
  - okdp.io/secrets-backend
